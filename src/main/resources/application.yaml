spring:
  application:
    name: fashion-shop
  datasource:
    url: jdbc:mysql://localhost:3306/nang_fashion_db?rewriteBatchedStatements=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  elasticsearch:
    uris: http://localhost:9200
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /docs/openapi.yaml

aws:
  s3:
    bucket-name: nang-fashion-storage-mock
    region: ap-southeast-1
    access-key: MOCK_AWS_ACCESS_KEY_123456
    secret-key: MOCK_AWS_SECRET_KEY_abcdef123456


